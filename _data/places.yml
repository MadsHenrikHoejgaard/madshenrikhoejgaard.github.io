# ------------------------------------------------------------------
# PLACES ON THE MAP OF THE WRITING (Projects page)
#
# A piece appears on the map when its entry in external.yml (or the
# header of a post) has a line such as   place: symi
# A piece set in more than one place lists them all, for example
#   place: [kos, leros]
#
# Each place has:
#   id     a short name with no spaces, used in the place: line
#   name   the name shown on the map
#   lat    latitude in decimal degrees (north)
#   lon    longitude in decimal degrees (east)
#   label  where the name sits beside the dot: right, left, above
#          or below. Change it if two names overlap.
#
# To find the numbers for a new place, right-click the spot in
# Google Maps or OpenStreetMap; the first number shown is the
# latitude, the second the longitude. The map covers Greece only.
# ------------------------------------------------------------------

